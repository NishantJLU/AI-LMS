name: AI-LMS Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check Prisma Schema
      run: npx prisma validate

    - name: Type Check (TypeScript)
      run: npm run build # Next.js build includes type checking and linting

    - name: Lint Check
      run: npm run lint
